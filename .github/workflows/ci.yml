name: CI (example)

# Example GitHub Actions workflow for CHXSDL3Engine.
# Adjust package names / install steps for your runner (Ubuntu versions change).
# SDL3 may not be in default repos; you might need a PPA, build from source,
# or use prebuilt artifacts. This is a starting point to review.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Free Pascal (example)
        run: |
          sudo apt-get update
          # Package name/version varies by Ubuntu; adjust as needed.
          sudo apt-get install -y fpc

      - name: Install SDL3 (example - may need adjustment)
        run: |
          sudo apt-get update
          # On some distros SDL3 dev packages are named differently or absent.
          # If unavailable, install from source or add a suitable repository.
          sudo apt-get install -y libsdl3-dev || true
          # Verify; if missing, the build/tests will fail until SDL3 is provided.

      - name: Run headless tests (dummy)
        working-directory: Tests
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          chmod +x build.sh run_tests.sh
          ./run_tests.sh
